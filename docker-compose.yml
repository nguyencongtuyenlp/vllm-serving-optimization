version: '3.8'

services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: vllm-openai-server
    ports:
      - "8000:8000"
    environment:
      # Model configuration - override via .env file
      - MODEL_ID=${MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}
      - QUANTIZATION=${QUANTIZATION:-}
      
      # vLLM performance tuning for low VRAM (4GB)
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-2048}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.85}
      - DTYPE=${DTYPE:-auto}
      
      # Server configuration
      - HOST=0.0.0.0
      - PORT=8000
      
      # HuggingFace token (if needed for gated models)
      - HF_TOKEN=${HF_TOKEN:-}
    
    command: >
      --model ${MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${MAX_MODEL_LEN:-2048}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.85}
      --dtype ${DTYPE:-auto}
      ${QUANTIZATION:+--quantization $QUANTIZATION}
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    volumes:
      # Cache HuggingFace models to avoid re-downloading
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    name: vllm-network
